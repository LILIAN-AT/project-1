<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
  </head>
  <style>
    :root {
      --gold: #d4af37;
      --light-gold: #f2d675;
      --ink: #111827;
      --glass: rgba(255, 255, 255, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.22), transparent 28%),
        linear-gradient(135deg, #080808, #17130a 50%, #080808);
      background-size: 100% 100%, 400% 400%;
      animation: backgroundFlow 12s ease infinite;
    }

    @keyframes backgroundFlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    header {
      display: flex;
      align-items: center;
      min-height: 19px;
      padding: 12px 24px;
      background: #104713;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
      animation: slideDown 0.8s ease-out, headerColorFlow 8s ease-in-out infinite;
    }

    @keyframes headerColorFlow {
      0%, 100% { background: #0d5712; }
      33% { background: #7372ad; }
      66% { background: #435a18; }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    logo {
      --rx: 0deg;
      --ry: 0deg;
      display: inline-flex;
      perspective: 500px;
      animation: logoReveal 1s 0.2s both;
    }

    logo img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      mix-blend-mode: multiply;
      border-radius: 50%;
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      transform-style: preserve-3d;
      filter: drop-shadow(0 4px 7px rgba(0, 0, 0, 0.16));
      transition: transform 0.18s ease-out, filter 0.35s ease;
      will-change: transform;
    }

    logo:hover img {
      filter: drop-shadow(0 8px 13px rgba(212, 175, 55, 0.42));
    }

    @keyframes logoReveal {
      from { opacity: 0; transform: scale(0.75) rotate(-8deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    h1 {
      text-align: center;
      margin: 42px 20px 24px;
      color: var(--light-gold);
      letter-spacing: 1px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.55);
      animation: fadeUp 0.8s 0.25s both;
    }

    section {
      width: min(92%, 500px);
      margin: 24px auto;
    }

    section form {
      padding: 32px;
      border: 1px solid rgba(242, 214, 117, 0.28);
      border-radius: 18px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.38);
      animation: fadeUp 0.9s 0.4s both;
    }

    section h2 {
      text-align: center;
      color: var(--light-gold);
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #fff8d9;
    }

    input:not([type="submit"]) {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      outline: none;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
    }

    input:not([type="submit"]):focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.16);
      transform: translateY(-1px);
    }

    input[type="submit"] {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, #d4af37, #f2d675);
      color: #17130a;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.24);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    input[type="submit"]:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(212, 175, 55, 0.38);
    }

    input[type="submit"]:active {
      transform: translateY(0);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      margin-top: 48px;
      padding: 24px 0;
      background: rgba(5, 5, 5, 0.72);
      text-align: center;
      border-top: 1px solid rgba(212, 175, 55, 0.22);
    }

    footer section {
      margin: 0 auto;
    }

    footer p {
      margin: 6px 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 600px) {
      header { justify-content: left; min-height: 104px; }
      logo img { width: 80px; height: 80px; }
      section form { padding: 22px; }
      h1 { font-size: 1.65rem; }
    }
    

  </style>
  <body>
    <header>
      <logo>
        <img src="logo.jpg" alt="Green circular university seal against a white background. An open book sits above the red initials IUIU, with Arabic calligraphy around the emblem and the words Islamic University in Uganda around the lower edge. The inner motto reads My God Advance Me in Knowledge. Its formal design conveys a scholarly tone." width="100px" height="100px">
      </logo>
    </header>
    <h1>Welcome to IUIU sign up page</h1>
    <section>
      <h2>Sign Up</h2>
      <form action="home.html" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="e.g john_doe" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="e.g johndoe@email.com" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Create a strong password" required><br><br>
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required><br><br>

        <input type="submit" value="Sign Up">
      </form>
    </section>

    <footer>
      <section>
        <h3>Contact info</h3>
        <p>Email: info@iuiu.ac.ug</p>
        <p>Phone: +256 702 123 456</p>
        <p>Location: iuiu-kampala campus</p>
        <p>&copy; 2023 Islamic University In Uganda. All rights reserved.</p>
      </section>
    </footer>
    <script>
      // JavaScript code to validate password and confirm password fields
      const form = document.querySelector('form');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirm_password');

      form.addEventListener('submit', function(event) {
        if (password.value !== confirmPassword.value) {
          alert('Passwords do not match. Please try again.');
          event.preventDefault(); // Prevent form submission
        }
      });
    </script>
  </body>
</html>
